<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delayed Notifier</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <h1>Delayed Notifier</h1>
            <p>Schedule and manage your email notifications seamlessly.</p>
        </header>

        <div class="grid">
            <!-- Create Notification Card -->
            <section class="card glass">
                <h2>Schedule Email</h2>
                <form id="createForm">
                    <div class="input-group">
                        <label for="recipient_email">Recipient Email</label>
                        <input type="email" id="recipient_email" required placeholder="john@example.com">
                    </div>
                    <div class="input-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" required placeholder="Meeting Reminder">
                    </div>
                    <div class="input-group">
                        <label for="body">Message Body</label>
                        <textarea id="body" rows="4" required placeholder="Don't forget our meeting at 10 AM..."></textarea>
                    </div>
                    <div class="input-group">
                        <label for="scheduled_at">Scheduled Time</label>
                        <input type="datetime-local" id="scheduled_at" required>
                    </div>
                    <button type="submit" class="btn primary">Schedule Notification</button>
                </form>
                <div id="createResult" class="result"></div>
            </section>

            <!-- Manage Notification Card -->
            <section class="card glass">
                <h2>Manage Notification</h2>
                <form id="manageForm">
                    <div class="input-group">
                        <label for="notify_id">Notification ID (UUID)</label>
                        <input type="text" id="notify_id" required placeholder="e.g. 123e4567-e89b-12d3-a456-426614174000">
                    </div>
                    <div class="action-buttons">
                        <button type="button" id="btnCheckStatus" class="btn secondary">Check Status</button>
                        <button type="button" id="btnCancel" class="btn danger">Cancel Notification</button>
                    </div>
                </form>
                <div id="manageResult" class="result"></div>
            </section>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
